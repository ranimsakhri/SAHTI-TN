spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sahti?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
server.error.include-message=always
server.error.include-binding-errors=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
sahti.upload-dir=${SAHTI_UPLOAD_DIR:uploads}
sahti.admin.email=${SAHTI_ADMIN_EMAIL:admin@sahti.tn}
sahti.admin.password=${SAHTI_ADMIN_PASSWORD}
